[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-from-scratch"
version = "0.1.0"                     # バージョン

dependencies = [                      # ランタイム依存
  "numpy>=1.20",
]
requires-python = ">=3.8"             # 対応Pythonバージョン


[tool.setuptools]
packages = [
    "common",
    "dataset"
]